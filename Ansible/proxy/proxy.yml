---
- name: Configure a system-wide HTTP proxy
  hosts: proxy_clients
  become: true
  gather_facts: true
  vars_files:
    - vars.yml
  vars:
    # Credentials are folded into the URL only when a username is set.
    _proxy_auth: "{{ (system_proxy_user ~ ':' ~ system_proxy_password ~ '@') if system_proxy_user | length > 0 else '' }}"
    proxy_http: "{{ system_proxy_http | regex_replace('^(https?://)', '\\1' ~ _proxy_auth) }}"
    proxy_https: "{{ system_proxy_https | regex_replace('^(https?://)', '\\1' ~ _proxy_auth) }}"
    # Every managed block carries this marker so proxy_remove.yml can take it out again.
    proxy_marker: "# {mark} ANSIBLE MANAGED BLOCK proxy"

  handlers:
    - name: Restart docker
      ansible.builtin.systemd_service:
        name: docker
        state: restarted
        daemon_reload: true

  tasks:
    - name: Assert a proxy URL was supplied
      ansible.builtin.assert:
        that:
          - system_proxy_http | length > 0
          - system_proxy_http is match('^https?://')
        fail_msg: "system_proxy_http must be set to a http:// or https:// URL."
        quiet: true
      tags: [always]

    # -------------------------------------------------------------- environment
    # blockinfile, not lineinfile: the previous version appended the same three
    # lines on every run and left no way to remove them again.
    - name: Set the proxy in /etc/environment
      ansible.builtin.blockinfile:
        path: /etc/environment
        marker: "{{ proxy_marker }}"
        create: true
        owner: root
        group: root
        mode: '0644'
        block: |
          HTTP_PROXY={{ proxy_http }}
          HTTPS_PROXY={{ proxy_https }}
          NO_PROXY={{ system_proxy_no }}
          http_proxy={{ proxy_http }}
          https_proxy={{ proxy_https }}
          no_proxy={{ system_proxy_no }}
      no_log: "{{ system_proxy_user | length > 0 }}"
      when: system_proxy_targets.environment | bool
      tags: [environment]

    # --------------------------------------------------------------- package mgr
    - name: Set the proxy for APT
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/99proxy
        content: |
          Acquire::http::Proxy "{{ proxy_http }}";
          Acquire::https::Proxy "{{ proxy_https }}";
        owner: root
        group: root
        mode: '0644'
      no_log: "{{ system_proxy_user | length > 0 }}"
      when:
        - system_proxy_targets.apt | bool
        - ansible_os_family == 'Debian'
      tags: [packages]

    - name: Set the proxy for DNF
      ansible.builtin.lineinfile:
        path: /etc/dnf/dnf.conf
        regexp: '^proxy='
        line: "proxy={{ proxy_http }}"
        insertafter: '^\[main\]'
        create: true
        owner: root
        group: root
        mode: '0644'
      no_log: "{{ system_proxy_user | length > 0 }}"
      when:
        - system_proxy_targets.dnf | bool
        - ansible_os_family == 'RedHat'
      tags: [packages]

    - name: Set the proxy for zypper
      ansible.builtin.copy:
        dest: /etc/sysconfig/proxy
        content: |
          PROXY_ENABLED="yes"
          HTTP_PROXY="{{ proxy_http }}"
          HTTPS_PROXY="{{ proxy_https }}"
          NO_PROXY="{{ system_proxy_no }}"
        owner: root
        group: root
        mode: '0644'
      no_log: "{{ system_proxy_user | length > 0 }}"
      when:
        - system_proxy_targets.zypper | bool
        - ansible_os_family == 'Suse'
      tags: [packages]

    # -------------------------------------------------------------------- docker
    # The daemon does not read /etc/environment; it needs a systemd drop-in.
    - name: Look for the docker service
      ansible.builtin.stat:
        path: /usr/lib/systemd/system/docker.service
      register: proxy_docker_unit
      when: system_proxy_targets.docker | bool
      tags: [docker]

    - name: Configure the docker daemon proxy
      when:
        - system_proxy_targets.docker | bool
        - proxy_docker_unit.stat.exists | default(false)
      tags: [docker]
      block:
        - name: Create the docker systemd drop-in directory
          ansible.builtin.file:
            path: /etc/systemd/system/docker.service.d
            state: directory
            owner: root
            group: root
            mode: '0755'

        - name: Write the docker proxy drop-in
          ansible.builtin.copy:
            dest: /etc/systemd/system/docker.service.d/http-proxy.conf
            content: |
              [Service]
              Environment="HTTP_PROXY={{ proxy_http }}"
              Environment="HTTPS_PROXY={{ proxy_https }}"
              Environment="NO_PROXY={{ system_proxy_no }}"
            owner: root
            group: root
            mode: '0644'
          no_log: "{{ system_proxy_user | length > 0 }}"
          notify: Restart docker

    # --------------------------------------------------------------------- tools
    # Each of these writes the documented system-wide config file. The previous
    # version ran `<tool> --version` with `failed_when: rc != 0`, which aborted the
    # play on any host where the tool was absent — the opposite of the intended skip.
    - name: Set the proxy for git
      community.general.git_config:
        name: "{{ item.name }}"
        value: "{{ item.value }}"
        scope: system
      loop:
        - {name: http.proxy, value: "{{ proxy_http }}"}
        - {name: https.proxy, value: "{{ proxy_https }}"}
      loop_control:
        label: "{{ item.name }}"
      no_log: "{{ system_proxy_user | length > 0 }}"
      when: system_proxy_targets.git | bool
      failed_when: false
      tags: [tools]

    - name: Set the proxy for wget
      ansible.builtin.blockinfile:
        path: /etc/wgetrc
        marker: "{{ proxy_marker }}"
        create: true
        owner: root
        group: root
        mode: '0644'
        block: |
          use_proxy = on
          http_proxy = {{ proxy_http }}
          https_proxy = {{ proxy_https }}
          no_proxy = {{ system_proxy_no }}
      no_log: "{{ system_proxy_user | length > 0 }}"
      when: system_proxy_targets.wget | bool
      tags: [tools]

    # /etc/pip.conf is pip's documented global config. The previous version wrote
    # ~/.pip/pip.conf — under become that is root's home, and the parent did not exist.
    - name: Set the proxy for pip
      ansible.builtin.blockinfile:
        path: /etc/pip.conf
        marker: "{{ proxy_marker }}"
        create: true
        owner: root
        group: root
        mode: '0644'
        block: |
          [global]
          proxy = {{ proxy_http }}
      no_log: "{{ system_proxy_user | length > 0 }}"
      when: system_proxy_targets.pip | bool
      tags: [tools]

    - name: Set the proxy for npm
      ansible.builtin.blockinfile:
        path: /etc/npmrc
        marker: "{{ proxy_marker }}"
        create: true
        owner: root
        group: root
        mode: '0644'
        block: |
          proxy={{ proxy_http }}
          https-proxy={{ proxy_https }}
          noproxy={{ system_proxy_no }}
      no_log: "{{ system_proxy_user | length > 0 }}"
      when: system_proxy_targets.npm | bool
      tags: [tools]

    # -------------------------------------------------------------------- verify
    - name: Report what was configured
      ansible.builtin.debug:
        msg: >-
          Proxy {{ system_proxy_http }} applied to:
          {{ system_proxy_targets | dict2items | selectattr('value') | map(attribute='key') | list | join(', ') }}
      tags: [verify]
