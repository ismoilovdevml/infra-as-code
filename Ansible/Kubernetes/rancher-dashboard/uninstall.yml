---
# NOTE: the pre-existing version of this playbook ran `kubectl delete crd --all
# --namespace <ns>` four times. CustomResourceDefinitions are cluster-scoped —
# `--namespace` has no effect on `--all` — so that command deleted every CRD in the
# entire cluster (cert-manager's, MetalLB's, everything), not just Rancher's. This
# version only deletes CRDs whose group is *.cattle.io.
- name: Uninstall Rancher
  hosts: k8s_control
  become: false
  gather_facts: false
  vars_files:
    - vars.yml

  tasks:
    - name: Remove the Ingress (expose_rancher_ui.yml, if applied)
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        state: absent
        template: templates/ingress.yaml.j2
      tags: [uninstall]

    - name: Uninstall the Rancher Helm release
      kubernetes.core.helm:
        kubeconfig: "{{ kubeconfig_path }}"
        name: "{{ rancher_release_name }}"
        release_namespace: "{{ rancher_namespace }}"
        state: absent
        wait: true
      tags: [uninstall]

    - name: Remove the Rancher-related namespaces
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        state: absent
        kind: Namespace
        name: "{{ item }}"
        wait: true
      loop:
        - "{{ rancher_namespace }}"
        - "{{ rancher_fleet_namespace_local }}"
        - "{{ rancher_fleet_namespace }}"
        - "{{ rancher_capi_namespace }}"
      tags: [uninstall]

    - name: List all CustomResourceDefinitions
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig_path }}"
        api_version: apiextensions.k8s.io/v1
        kind: CustomResourceDefinition
      register: rancher_all_crds
      tags: [uninstall]

    - name: Identify Rancher-owned CRDs (*.cattle.io)
      ansible.builtin.set_fact:
        rancher_crd_names: >-
          {{ rancher_all_crds.resources
             | selectattr('metadata.name', 'match', '.*\.cattle\.io$')
             | map(attribute='metadata.name') | list }}
      tags: [uninstall]

    - name: Delete Rancher-owned CRDs
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        state: absent
        api_version: apiextensions.k8s.io/v1
        kind: CustomResourceDefinition
        name: "{{ item }}"
      loop: "{{ rancher_crd_names }}"
      tags: [uninstall]
