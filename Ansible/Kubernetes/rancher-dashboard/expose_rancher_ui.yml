---
- name: Expose Rancher UI with an Ingress
  hosts: k8s_control
  become: false
  gather_facts: false
  vars_files:
    - vars.yml

  tasks:
    - name: Preflight
      tags: [always]
      block:
        - name: Verify the Rancher Service exists
          kubernetes.core.k8s_info:
            kubeconfig: "{{ kubeconfig_path }}"
            kind: Service
            name: "{{ rancher_service_name }}"
            namespace: "{{ rancher_namespace }}"
          register: rancher_service_check

        - name: Fail if the Rancher Service does not exist
          ansible.builtin.assert:
            that:
              - rancher_service_check.resources | length > 0
            fail_msg: "Service {{ rancher_service_name }} not found in {{ rancher_namespace }}. Run install.yml first."
            quiet: true

    - name: Apply the Ingress
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        state: present
        template: templates/ingress.yaml.j2
      tags: [configure]

    - name: Show the Ingress status
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig_path }}"
        kind: Ingress
        name: "{{ rancher_ingress_name }}"
        namespace: "{{ rancher_namespace }}"
      register: rancher_ingress_status
      tags: [verify]

    - name: Show the Ingress
      ansible.builtin.debug:
        var: rancher_ingress_status.resources
      tags: [verify]
