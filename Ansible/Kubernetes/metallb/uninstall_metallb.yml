---
- name: Uninstall MetalLB
  hosts: k8s_control
  become: false
  gather_facts: false
  vars_files:
    - vars.yml

  tasks:
    - name: Remove the IPAddressPool and L2Advertisement
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        state: absent
        template: templates/ipaddresspool.yaml.j2
      tags: [uninstall]

    - name: Uninstall the MetalLB Helm release
      kubernetes.core.helm:
        kubeconfig: "{{ kubeconfig_path }}"
        name: "{{ metallb_release_name }}"
        release_namespace: "{{ metallb_namespace }}"
        state: absent
        wait: true
      tags: [uninstall]

    - name: Remove the MetalLB namespace
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        state: absent
        kind: Namespace
        name: "{{ metallb_namespace }}"
        wait: true
      tags: [uninstall]
