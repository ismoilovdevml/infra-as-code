---
- name: Configure MetalLB IP address pool
  hosts: k8s_control
  become: false
  gather_facts: false
  vars_files:
    - vars.yml

  tasks:
    - name: Preflight
      tags: [always]
      block:
        - name: Verify the MetalLB CRDs are established
          kubernetes.core.k8s_info:
            kubeconfig: "{{ kubeconfig_path }}"
            api_version: apiextensions.k8s.io/v1
            kind: CustomResourceDefinition
            name: ipaddresspools.metallb.io
          register: metallb_crd_check

        - name: Fail if the MetalLB CRDs are missing
          ansible.builtin.assert:
            that:
              - metallb_crd_check.resources | length > 0
            fail_msg: >-
              ipaddresspools.metallb.io CRD not found. Run install_metallb.yml first
              and wait for the release to finish installing.
            quiet: true

    - name: Apply the IPAddressPool and L2Advertisement
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        state: present
        template: templates/ipaddresspool.yaml.j2
      tags: [configure]

    - name: Show the IPAddressPool status
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig_path }}"
        api_version: metallb.io/v1beta1
        kind: IPAddressPool
        name: "{{ metallb_ip_pool_name }}"
        namespace: "{{ metallb_namespace }}"
      register: metallb_pool_status
      tags: [verify]

    - name: Show the IPAddressPool
      ansible.builtin.debug:
        var: metallb_pool_status.resources
      tags: [verify]
