---
- name: Configure cert-manager with a Let's Encrypt ClusterIssuer
  hosts: k8s_control
  become: false
  gather_facts: false
  vars_files:
    - vars.yml

  tasks:
    - name: Preflight
      tags: [always]
      block:
        - name: Assert an ACME email address was provided
          ansible.builtin.assert:
            that:
              - certmanager_acme_email | length > 0
            fail_msg: >-
              certmanager_acme_email is empty. Let's Encrypt uses this address for
              expiry notices; set -e certmanager_acme_email=<you@example.com>.
            quiet: true

        - name: Verify the kubeconfig can reach the cluster
          kubernetes.core.k8s_info:
            kubeconfig: "{{ kubeconfig_path }}"
            kind: Namespace
            name: "{{ certmanager_namespace }}"
          register: certmanager_ns_check

        - name: Fail if the cert-manager namespace does not exist
          ansible.builtin.assert:
            that:
              - certmanager_ns_check.resources | length > 0
            fail_msg: >-
              Namespace {{ certmanager_namespace }} not found. Run install_certmanager.yml first.
            quiet: true

    - name: Apply the ClusterIssuer
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        state: present
        template: templates/clusterissuer.yaml.j2
      tags: [configure]

    - name: Show the ClusterIssuer status
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig_path }}"
        api_version: cert-manager.io/v1
        kind: ClusterIssuer
        name: "{{ certmanager_cluster_issuer_name }}"
      register: certmanager_cluster_issuer
      tags: [verify]

    - name: Show the ClusterIssuer conditions
      ansible.builtin.debug:
        var: certmanager_cluster_issuer.resources[0].status
      tags: [verify]
