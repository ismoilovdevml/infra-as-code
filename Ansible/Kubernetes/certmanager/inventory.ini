# This module acts on a Kubernetes cluster via the API (kubernetes.core modules), not
# over SSH. All plays target localhost with a kubeconfig; the "node" here is whichever
# host runs ansible-playbook and holds a working kubeconfig (an admin workstation, a
# bastion, or a control-plane node used as the Ansible controller).
[k8s_control]
localhost ansible_connection=local
