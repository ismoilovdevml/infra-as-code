---
- name: Uninstall cert-manager
  hosts: k8s_control
  become: false
  gather_facts: false
  vars_files:
    - vars.yml

  tasks:
    - name: Remove the ClusterIssuer
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        state: absent
        api_version: cert-manager.io/v1
        kind: ClusterIssuer
        name: "{{ certmanager_cluster_issuer_name }}"
      tags: [uninstall]

    - name: Uninstall the cert-manager Helm release
      kubernetes.core.helm:
        kubeconfig: "{{ kubeconfig_path }}"
        name: "{{ certmanager_release_name }}"
        release_namespace: "{{ certmanager_namespace }}"
        state: absent
        wait: true
      tags: [uninstall]

    - name: Remove the cert-manager namespace
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        state: absent
        kind: Namespace
        name: "{{ certmanager_namespace }}"
        wait: true
      tags: [uninstall]
