---
- name: Uninstall ingress-nginx
  hosts: k8s_control
  become: false
  gather_facts: false
  vars_files:
    - vars.yml

  tasks:
    - name: Uninstall the ingress-nginx Helm release
      kubernetes.core.helm:
        kubeconfig: "{{ kubeconfig_path }}"
        name: "{{ ingress_nginx_release_name }}"
        release_namespace: "{{ ingress_nginx_namespace }}"
        state: absent
        wait: true
      tags: [uninstall]

    - name: Remove the ingress-nginx namespace
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        state: absent
        kind: Namespace
        name: "{{ ingress_nginx_namespace }}"
        wait: true
      tags: [uninstall]
