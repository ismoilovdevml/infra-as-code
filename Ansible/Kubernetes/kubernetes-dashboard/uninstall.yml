---
- name: Uninstall Kubernetes Dashboard
  hosts: k8s_control
  become: false
  gather_facts: false
  vars_files:
    - vars.yml

  tasks:
    - name: Remove the Ingress
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        state: absent
        template: templates/ingress.yaml.j2
      tags: [uninstall]

    - name: Remove the admin-user ServiceAccount and ClusterRoleBinding
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        state: absent
        template: templates/admin-user-rbac.yaml.j2
      tags: [uninstall]

    - name: Uninstall the Kubernetes Dashboard Helm release
      kubernetes.core.helm:
        kubeconfig: "{{ kubeconfig_path }}"
        name: "{{ dashboard_release_name }}"
        release_namespace: "{{ dashboard_namespace }}"
        state: absent
        wait: true
      tags: [uninstall]

    - name: Remove the Kubernetes Dashboard namespace
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        state: absent
        kind: Namespace
        name: "{{ dashboard_namespace }}"
        wait: true
      tags: [uninstall]
