---
- name: Expose Kubernetes Dashboard with Ingress
  hosts: k8s_control
  become: false
  gather_facts: false
  vars_files:
    - vars.yml

  tasks:
    - name: Preflight
      tags: [always]
      block:
        - name: Verify the Kubernetes Dashboard Service exists
          kubernetes.core.k8s_info:
            kubeconfig: "{{ kubeconfig_path }}"
            kind: Service
            name: "{{ dashboard_service_name }}"
            namespace: "{{ dashboard_namespace }}"
          register: dashboard_service_check

        - name: Fail if the Kubernetes Dashboard Service does not exist
          ansible.builtin.assert:
            that:
              - dashboard_service_check.resources | length > 0
            fail_msg: >-
              Service {{ dashboard_service_name }} not found in {{ dashboard_namespace }}.
              Run install.yml first.
            quiet: true

    - name: Apply the Ingress
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        state: present
        template: templates/ingress.yaml.j2
      tags: [configure]

    - name: Show the Ingress status
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig_path }}"
        kind: Ingress
        name: "{{ dashboard_ingress_name }}"
        namespace: "{{ dashboard_namespace }}"
      register: dashboard_ingress_status
      tags: [verify]

    - name: Show the Ingress
      ansible.builtin.debug:
        var: dashboard_ingress_status.resources
      tags: [verify]
