---
# Cleans up any existing KubeSphere install (from a working ks-core Helm release, or
# a legacy v3.x ks-installer install). Deleting a namespace cascades to every
# namespaced resource inside it, so this does not need to delete Pods/PVCs/
# StatefulSets one at a time the way the pre-existing version of this playbook did.
- name: Uninstall KubeSphere
  hosts: k8s_control
  become: false
  gather_facts: false
  vars_files:
    - vars.yml

  tasks:
    - name: Remove the Ingress (expose_kubesphere.yml, if applied)
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        state: absent
        template: templates/ingress.yaml.j2
      tags: [uninstall]

    - name: Uninstall the KubeSphere Helm release, if present
      kubernetes.core.helm:
        kubeconfig: "{{ kubeconfig_path }}"
        name: "{{ kubesphere_release_name }}"
        release_namespace: "{{ kubesphere_namespace }}"
        state: absent
        wait: true
      tags: [uninstall]

    - name: Remove KubeSphere-related namespaces
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        state: absent
        kind: Namespace
        name: "{{ item }}"
        wait: true
      loop:
        - "{{ kubesphere_namespace }}"
        - kubesphere-controls-system
        - kubesphere-monitoring-system
        - kubesphere-monitoring-federated
      tags: [uninstall]

    - name: Remove KubeSphere ValidatingWebhookConfigurations (legacy v3.x install)
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        state: absent
        api_version: admissionregistration.k8s.io/v1
        kind: ValidatingWebhookConfiguration
        name: "{{ item }}"
      loop:
        - network.kubesphere.io
        - resourcesquotas.quota.kubesphere.io
        - storageclass-accessor.storage.kubesphere.io
        - users.iam.kubesphere.io
      tags: [uninstall]
