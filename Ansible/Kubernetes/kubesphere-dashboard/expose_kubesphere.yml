---
# NOTE: the Service name/port here reflect KubeSphere v3.x's architecture (the
# pre-existing playbook's assumption). Re-verify against whatever install path you
# actually use — see install.yml and README.md "Status".
- name: Expose KubeSphere Dashboard with Ingress
  hosts: k8s_control
  become: false
  gather_facts: false
  vars_files:
    - vars.yml

  tasks:
    - name: Preflight
      tags: [always]
      block:
        - name: Verify the KubeSphere console Service exists
          kubernetes.core.k8s_info:
            kubeconfig: "{{ kubeconfig_path }}"
            kind: Service
            name: "{{ kubesphere_service_name }}"
            namespace: "{{ kubesphere_namespace }}"
          register: kubesphere_service_check

        - name: Fail if the KubeSphere console Service does not exist
          ansible.builtin.assert:
            that:
              - kubesphere_service_check.resources | length > 0
            fail_msg: >-
              Service {{ kubesphere_service_name }} not found in
              {{ kubesphere_namespace }}. Install KubeSphere first (see install.yml
              and README.md "Status").
            quiet: true

    - name: Apply the Ingress
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        state: present
        template: templates/ingress.yaml.j2
      tags: [configure]

    - name: Show the Ingress status
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig_path }}"
        kind: Ingress
        name: "{{ kubesphere_ingress_name }}"
        namespace: "{{ kubesphere_namespace }}"
      register: kubesphere_ingress_status
      tags: [verify]

    - name: Show the Ingress
      ansible.builtin.debug:
        var: kubesphere_ingress_status.resources
      tags: [verify]
