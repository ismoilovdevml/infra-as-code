---
- name: Install ActiveMQ Artemis
  hosts: artemis_servers
  become: true
  gather_facts: true
  vars_files:
    - vars.yml

  handlers:
    - name: Restart artemis
      ansible.builtin.systemd_service:
        name: artemis
        state: restarted
        daemon_reload: true

  tasks:
    # ---------------------------------------------------------------- preflight
    - name: Assert the platform is supported
      ansible.builtin.assert:
        that:
          - ansible_os_family in java_packages
        fail_msg: >-
          No Java 17 package mapping for {{ ansible_distribution }} ({{ ansible_os_family }}).
          Supported families: {{ java_packages.keys() | list | join(', ') }}.
        quiet: true
      tags: [always]

    - name: Assert the admin password is set
      ansible.builtin.assert:
        that:
          - artemis_admin_password | length > 0
        fail_msg: >-
          artemis_admin_password is empty. Set vault_artemis_admin_password via
          ansible-vault before running this playbook.
        quiet: true
      tags: [always]

    - name: Install required packages
      ansible.builtin.package:
        name:
          - curl
          - wget
          - git
          - "{{ java_packages[ansible_os_family] }}"
        state: present
      tags: [install]

    # Package paths differ per distro/arch, so the installed java binary is located
    # rather than hardcoded; this is a read-only lookup, not a state change.
    - name: Locate the Java 17 executable
      ansible.builtin.shell:
        cmd: "set -o pipefail; find /usr/lib/jvm -maxdepth 1 -name '*17*' -type d | head -n1"
        executable: /bin/bash
      register: artemis_java_home
      changed_when: false
      check_mode: false
      tags: [install]

    - name: Set Java 17 as the default alternative
      community.general.alternatives:
        name: java
        path: "{{ artemis_java_home.stdout | trim }}/bin/java"
        link: /usr/bin/java
        priority: 100
      when: artemis_java_home.stdout | trim | length > 0
      tags: [install]

    - name: Verify the Java version
      ansible.builtin.command: java -version
      register: artemis_java_version
      changed_when: false
      check_mode: false
      tags: [verify]

    - name: Assert Java 17 or newer
      ansible.builtin.assert:
        that:
          - (artemis_java_version.stderr | regex_search('version "([0-9]+)', '\1') | first | int) >= 17
        fail_msg: "Artemis {{ artemis_version }} requires Java 17+; found: {{ artemis_java_version.stderr_lines | first }}"
        quiet: true
      tags: [install]

    # ------------------------------------------------------------------ account
    - name: Create the artemis group
      ansible.builtin.group:
        name: "{{ artemis_group }}"
        system: true
      tags: [install]

    - name: Create the artemis user
      ansible.builtin.user:
        name: "{{ artemis_user }}"
        group: "{{ artemis_group }}"
        system: true
        shell: /usr/sbin/nologin
        create_home: true
      tags: [install]

    # ----------------------------------------------------------------- download
    # Apache publishes .sha512 in two historical layouts:
    #   "<hash>  <file>" and "<file>: <hash with spaces>". Normalise both.
    - name: Fetch the release checksum
      ansible.builtin.uri:
        url: "{{ artemis_checksum_url }}/{{ artemis_version }}/{{ artemis_tarball }}.sha512"
        return_content: true
      register: artemis_sha512
      check_mode: false
      tags: [install]

    - name: Normalise the checksum
      ansible.builtin.set_fact:
        artemis_sha512_digest: >-
          {{ ((artemis_sha512.content.split(':') | last) if ':' in artemis_sha512.content
              else (artemis_sha512.content.split() | first))
             | regex_replace('\s+', '') | lower }}
      tags: [install]

    - name: Download the Artemis tarball
      ansible.builtin.get_url:
        url: "{{ artemis_mirror_url }}/{{ artemis_version }}/{{ artemis_tarball }}"
        dest: "/tmp/{{ artemis_tarball }}"
        checksum: "sha512:{{ artemis_sha512_digest }}"
        owner: root
        group: root
        mode: '0644'
      tags: [install]

    - name: Unpack Artemis
      ansible.builtin.unarchive:
        src: "/tmp/{{ artemis_tarball }}"
        dest: "{{ artemis_install_root }}"
        remote_src: true
        owner: "{{ artemis_user }}"
        group: "{{ artemis_group }}"
        creates: "{{ artemis_versioned_dir }}"
      tags: [install]

    - name: Link the install root to the installed version
      ansible.builtin.file:
        src: "{{ artemis_versioned_dir }}"
        dest: "{{ artemis_install_dir }}"
        state: link
        owner: "{{ artemis_user }}"
        group: "{{ artemis_group }}"
      tags: [install]

    # ------------------------------------------------------------------ instance
    # `artemis create` is not idempotent and does not accept re-running without
    # --force (which would silently recreate the instance), so it is guarded by
    # `creates:` against the instance's own startup script.
    - name: Create the Artemis broker instance
      ansible.builtin.command:
        cmd: >-
          {{ artemis_install_dir }}/bin/artemis create {{ artemis_instance_dir }}
          --user {{ artemis_admin_user }} --password {{ artemis_admin_password }}
          --host {{ artemis_web_bind_address }} --allow-anonymous --force
        creates: "{{ artemis_instance_dir }}/bin/artemis-service"
      no_log: true
      tags: [install]

    - name: Set ownership of the instance directory
      ansible.builtin.file:
        path: "{{ artemis_instance_dir }}"
        state: directory
        owner: "{{ artemis_user }}"
        group: "{{ artemis_group }}"
        recurse: true
      tags: [install]

    # ---------------------------------------------------------------- configure
    - name: Bind the web console to the configured address
      ansible.builtin.replace:
        path: "{{ artemis_instance_dir }}/etc/bootstrap.xml"
        regexp: '(<binding name="artemis" uri=")(.*)(:{{ artemis_web_port }}">)'
        replace: '\1http://{{ artemis_web_bind_address }}\3'
      notify: Restart artemis
      tags: [configure]

    - name: Allow Jolokia access from any origin
      ansible.builtin.replace:
        path: "{{ artemis_instance_dir }}/etc/jolokia-access.xml"
        regexp: '<allow-origin>.*</allow-origin>'
        replace: '<allow-origin>*://*</allow-origin>'
      notify: Restart artemis
      tags: [configure]

    - name: Install the systemd unit
      ansible.builtin.template:
        src: artemis.service.j2
        dest: /etc/systemd/system/artemis.service
        owner: root
        group: root
        mode: '0644'
      notify: Restart artemis
      tags: [configure]

    # ------------------------------------------------------------------ service
    - name: Enable and start artemis
      ansible.builtin.systemd_service:
        name: artemis
        enabled: true
        state: started
        daemon_reload: true
      tags: [service]

    - name: Wait for the acceptor port
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ artemis_acceptor_port }}"
        timeout: 120
      tags: [verify]

    - name: Show the broker status
      ansible.builtin.debug:
        msg: "Artemis {{ artemis_version }} listening on {{ inventory_hostname }}:{{ artemis_acceptor_port }}"
      tags: [verify]
