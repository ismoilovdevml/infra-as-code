---
- name: Configure the ActiveMQ Artemis shared-store primary
  hosts: master
  become: true
  gather_facts: true
  vars_files:
    - vars.yml

  handlers:
    - name: Pause before node restart
      ansible.builtin.pause:
        minutes: 1

  tasks:
    - name: Configure the primary broker
      ansible.builtin.template:
        src: master-broker.xml.j2
        dest: "{{ artemis_instance_dir }}/etc/broker.xml"
        owner: "{{ artemis_user }}"
        group: "{{ artemis_group }}"
        mode: '0640'
      tags: [configure]

    - name: Restart Artemis on the primary
      ansible.builtin.systemd_service:
        name: artemis
        state: restarted
        enabled: true
      notify: Pause before node restart
      tags: [service]

- name: Configure the ActiveMQ Artemis shared-store backups
  hosts: nodes
  become: true
  gather_facts: true
  vars_files:
    - vars.yml

  tasks:
    - name: Configure the backup broker
      ansible.builtin.template:
        src: node-broker.xml.j2
        dest: "{{ artemis_instance_dir }}/etc/broker.xml"
        owner: "{{ artemis_user }}"
        group: "{{ artemis_group }}"
        mode: '0640'
      tags: [configure]

    - name: Restart Artemis on the backup
      ansible.builtin.systemd_service:
        name: artemis
        state: restarted
        enabled: true
      tags: [service]
