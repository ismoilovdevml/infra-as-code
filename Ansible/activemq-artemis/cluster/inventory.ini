# node.id/connectors and the keepalived VIP setup are derived from these group
# names ("master" is the shared-store primary, "nodes" are backups), so keep the
# hostnames stable.
[master]
master ansible_host=10.0.0.11 ansible_user=root

[nodes]
node1 ansible_host=10.0.0.12 ansible_user=root
node2 ansible_host=10.0.0.13 ansible_user=root

[nfs_server]
nfs ansible_host=10.0.0.20 ansible_user=root
