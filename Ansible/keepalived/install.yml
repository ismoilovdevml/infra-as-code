---
# Installs the keepalived package. keepalived.org publishes no binary repository of its own
# (source tarball only), so every OS family installs its own distribution package.
- name: Install Keepalived
  hosts: keepalived_nodes
  become: true
  gather_facts: true
  vars_files:
    - vars.yml

  tasks:
    - name: Preflight
      tags: [always]
      block:
        - name: Assert the platform is supported
          ansible.builtin.assert:
            that:
              - ansible_os_family in keepalived_supported_os_families
            fail_msg: >-
              {{ ansible_distribution }} {{ ansible_distribution_version }} is not supported.
              keepalived.org ships no binary repository; this module relies on the
              distribution package, available for Debian, RedHat and Suse families.
            quiet: true

    - name: Install keepalived
      ansible.builtin.package:
        name: "{{ keepalived_package_name }}"
        state: present
      tags: [install]

    - name: Collect the installed version
      ansible.builtin.command: keepalived --version
      changed_when: false
      check_mode: false
      failed_when: false
      register: keepalived_verify
      tags: [verify]

    - name: Show the installed version
      ansible.builtin.debug:
        # keepalived --version prints to stderr.
        msg: "{{ (keepalived_verify.stdout + keepalived_verify.stderr) | trim }}"
      tags: [verify]
