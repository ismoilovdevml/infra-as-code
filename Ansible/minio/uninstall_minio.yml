---
# Destructive when minio_purge_data is true: removes every object MinIO ever stored.
- name: Uninstall MinIO
  hosts: minio_servers
  become: true
  gather_facts: true
  vars_files:
    - vars.yml

  tasks:
    - name: Stop and disable minio
      ansible.builtin.systemd_service:
        name: minio
        state: stopped
        enabled: false
      failed_when: false
      tags: [uninstall]

    - name: Remove the systemd unit
      ansible.builtin.file:
        path: /etc/systemd/system/minio.service
        state: absent
      tags: [uninstall]

    - name: Reload systemd
      ansible.builtin.systemd_service:
        daemon_reload: true
      tags: [uninstall]

    - name: Remove the MinIO package (Debian family)
      ansible.builtin.apt:
        name: minio
        state: absent
        purge: true
      when: ansible_os_family == 'Debian'
      failed_when: false
      tags: [uninstall]

    - name: Remove the MinIO package (RedHat family)
      ansible.builtin.dnf:
        name: minio
        state: absent
      when: ansible_os_family == 'RedHat'
      failed_when: false
      tags: [uninstall]

    - name: Remove the MinIO and mc binaries
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ minio_install_dir }}/minio"
        - "{{ minio_install_dir }}/mc"
      tags: [uninstall]

    - name: Remove the MinIO configuration
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ minio_default_env_path }}"
        - "{{ minio_config_dir }}"
      tags: [uninstall]

    - name: Remove the MinIO data directory
      ansible.builtin.file:
        path: "{{ minio_directory }}"
        state: absent
      when: minio_purge_data | bool
      tags: [uninstall]

    - name: Remove the minio user
      ansible.builtin.user:
        name: "{{ minio_user }}"
        state: absent
        remove: false
      tags: [uninstall]

    - name: Remove the minio group
      ansible.builtin.group:
        name: "{{ minio_group }}"
        state: absent
      failed_when: false
      tags: [uninstall]
