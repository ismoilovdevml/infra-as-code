# zookeeper_id is the myid value. Set it explicitly and never renumber a live
# cluster; if omitted it falls back to the host's position in this group.
[zookeeper_nodes]
node1 ansible_host=10.0.0.11 zookeeper_id=1
node2 ansible_host=10.0.0.12 zookeeper_id=2
node3 ansible_host=10.0.0.13 zookeeper_id=3

[zookeeper_nodes:vars]
ansible_user=ubuntu
ansible_ssh_private_key_file=~/.ssh/id_ed25519
