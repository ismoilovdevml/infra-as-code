# node.id and the controller quorum are derived from the order of this group,
# so keep it stable. Three nodes is the smallest sensible KRaft quorum.
[kafka_nodes]
node1 ansible_host=10.0.0.11
node2 ansible_host=10.0.0.12
node3 ansible_host=10.0.0.13

[kafka_nodes:vars]
ansible_user=ubuntu
ansible_ssh_private_key_file=~/.ssh/id_ed25519
