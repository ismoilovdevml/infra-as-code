---
# Destructive. Stops and removes the Harbor containers and images. When
# harbor_purge_data is true, also removes harbor_data_volume, the install directory,
# and the generated TLS material (self-signed key/cert or the certbot lineage).
- name: Uninstall Harbor
  hosts: harbor_servers
  become: true
  gather_facts: true
  vars_files:
    - vars.yml

  tasks:
    - name: Check whether Harbor has been installed
      ansible.builtin.stat:
        path: "{{ harbor_install_dir }}/docker-compose.yml"
      register: harbor_compose_file
      tags: [always]

    # Removing via the compose project (rather than a hardcoded container/image list)
    # stays correct across version bumps — the old list here was pinned to v2.11.1 and
    # would silently miss containers/images from any other installed version.
    - name: Stop and remove the Harbor stack
      community.docker.docker_compose_v2:
        project_src: "{{ harbor_install_dir }}"
        state: absent
        remove_images: all
        remove_volumes: "{{ harbor_purge_data }}"
      when: harbor_compose_file.stat.exists
      tags: [uninstall]

    - name: Remove the Harbor installation directory
      ansible.builtin.file:
        path: "{{ harbor_install_dir }}"
        state: absent
      tags: [uninstall]

    - name: Remove the downloaded installer tarball
      ansible.builtin.file:
        path: "/tmp/harbor-{{ harbor_installer_type }}-installer-{{ harbor_version }}.tgz"
        state: absent
      tags: [uninstall]

    - name: Remove the Harbor data volume
      ansible.builtin.file:
        path: "{{ harbor_data_volume }}"
        state: absent
      when: harbor_purge_data | bool
      tags: [uninstall]

    - name: Remove the self-signed TLS directory
      ansible.builtin.file:
        path: "{{ harbor_ssl_dir }}"
        state: absent
      when:
        - harbor_purge_data | bool
        - harbor_ssl_option == 'self_signed'
      tags: [uninstall]

    - name: Remove the certbot certificate lineage
      ansible.builtin.command:
        cmd: "certbot delete --non-interactive --cert-name {{ harbor_hostname }}"
      when:
        - harbor_purge_data | bool
        - harbor_ssl_option == 'certbot'
      failed_when: false
      changed_when: true
      tags: [uninstall]
