---
# https://github.com/goharbor/harbor/releases — current stable at time of writing.
harbor_version: "v2.15.2"
# Pins the harbor.yml *schema* version bundled inside this exact release's own
# harbor.yml.tmpl (fetched and confirmed directly from the v2.15.2 tag). This is NOT
# the same number as harbor_version and must only be bumped after checking the new
# release's own template — it maps to Harbor's internal config migrator.
harbor_config_schema_version: "2.15.0"

# "offline" bundles all component images in the tarball (no internet needed on the
# target during install); "online" is a much smaller download that pulls images from
# Docker Hub during install.sh.
harbor_installer_type: offline
harbor_download_url: >-
  https://github.com/goharbor/harbor/releases/download/{{ harbor_version }}/harbor-{{ harbor_installer_type }}-installer-{{ harbor_version }}.tgz
# Upstream's docs still describe GPG .asc verification, but the v2.15.2 release assets
# ship .sigstore.json bundles and a plain md5sum file instead — no .asc file exists to
# verify against. This checksums against the (non-cryptographic) md5sum file; there is
# no built-in Ansible sigstore/cosign verifier for full authenticity verification.
harbor_checksum_url: "https://github.com/goharbor/harbor/releases/download/{{ harbor_version }}/md5sum"

harbor_install_dir: /opt/harbor
harbor_data_volume: /data
harbor_ssl_dir: /etc/harbor/ssl

# Must NOT be 127.0.0.1 or the literal template placeholder reg.mydomain.com — Harbor's
# own prepare script hard-fails the install on both.
harbor_hostname: harbor.example.internal

harbor_http_port: 80
harbor_https_port: 443

# "self_signed" (generated by this playbook via community.crypto), "certbot"
# (Let's Encrypt — requires harbor_hostname to resolve publicly and port 80 reachable
# from the internet), or "disabled" (omits the https: block entirely; Harbor's own
# prepare script allows this, logging a plaintext warning instead of failing).
harbor_ssl_option: self_signed
harbor_certbot_email: "admin@{{ harbor_hostname }}"

harbor_self_signed_cert_path: "{{ harbor_ssl_dir }}/harbor.crt"
harbor_self_signed_key_path: "{{ harbor_ssl_dir }}/harbor.key"
harbor_certbot_cert_path: "/etc/letsencrypt/live/{{ harbor_hostname }}/fullchain.pem"
harbor_certbot_key_path: "/etc/letsencrypt/live/{{ harbor_hostname }}/privkey.pem"

harbor_with_trivy: false

# No committed secrets: set both via ansible-vault. The play refuses to run while
# either is empty.
harbor_admin_password: "{{ vault_harbor_admin_password | default('') }}"
harbor_db_password: "{{ vault_harbor_db_password | default('') }}"

# cleanup.yml only: also delete harbor_data_volume and the self-signed cert directory.
harbor_purge_data: false
