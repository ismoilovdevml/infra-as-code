---
# Destructive. Removes the Jenkins package, its repository and, when
# jenkins_purge_data is true, JENKINS_HOME itself (every job, credential and config).
- name: Uninstall Jenkins
  hosts: jenkins_servers
  become: true
  gather_facts: true
  vars_files:
    - vars.yml

  tasks:
    - name: Stop and disable jenkins
      ansible.builtin.systemd_service:
        name: jenkins
        state: stopped
        enabled: false
      failed_when: false
      tags: [uninstall]

    - name: Remove the Jenkins package
      ansible.builtin.package:
        name: jenkins
        state: absent
      tags: [uninstall]

    - name: Purge the Jenkins package (Debian family)
      ansible.builtin.apt:
        name: jenkins
        state: absent
        purge: true
        autoremove: false
      when: ansible_os_family == 'Debian'
      failed_when: false
      tags: [uninstall]

    - name: Remove the systemd override
      ansible.builtin.file:
        path: /etc/systemd/system/jenkins.service.d
        state: absent
      tags: [uninstall]

    - name: Reload systemd
      ansible.builtin.systemd_service:
        daemon_reload: true
      tags: [uninstall]

    - name: Remove the Jenkins repository (Debian family)
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/apt/sources.list.d/jenkins.sources
        - /etc/apt/sources.list.d/jenkins.list
        - /etc/apt/keyrings/jenkins-keyring.asc
        - /usr/share/keyrings/jenkins-keyring.asc
      when: ansible_os_family == 'Debian'
      tags: [uninstall]

    - name: Remove the Jenkins repository (RedHat family)
      ansible.builtin.file:
        path: /etc/yum.repos.d/jenkins.repo
        state: absent
      when: ansible_os_family == 'RedHat'
      tags: [uninstall]

    - name: Remove the Jenkins repository (SUSE)
      community.general.zypper_repository:
        name: jenkins
        state: absent
      when: ansible_os_family == 'Suse'
      failed_when: false
      tags: [uninstall]

    - name: Remove the Jenkins cache and log directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /var/cache/jenkins
        - /var/log/jenkins
      tags: [uninstall]

    - name: Remove JENKINS_HOME
      ansible.builtin.file:
        path: "{{ jenkins_home }}"
        state: absent
      when: jenkins_purge_data | bool
      tags: [uninstall]
