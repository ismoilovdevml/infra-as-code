---
- name: Configure PostgreSQL
  hosts: all
  become: true
  vars_files:
    - vars.yml

  tasks:
    - name: Assert vault-backed admin password is set
      ansible.builtin.assert:
        that:
          - postgresql_admin_password | length > 0
        fail_msg: >-
          postgresql_admin_password is empty. Set vault_postgresql_admin_password via
          ansible-vault (see README).
        quiet: true
      tags: [always]

    - name: Set listen_addresses in postgresql.conf
      ansible.builtin.lineinfile:
        path: "{{ postgresql_conf_path }}"
        regexp: "^#?listen_addresses\\s*="
        line: "listen_addresses = '{{ postgresql_listen_addresses }}'"
        # postgresql.conf is generated by initdb with hundreds of commented defaults;
        # a full template would fight that file. Only the settings we manage are touched.
      notify: Restart PostgreSQL
      tags: [configure]

    - name: Set port in postgresql.conf
      ansible.builtin.lineinfile:
        path: "{{ postgresql_conf_path }}"
        regexp: "^#?port\\s*="
        line: "port = {{ postgresql_port }}"
      notify: Restart PostgreSQL
      tags: [configure]

    - name: Deploy pg_hba.conf
      ansible.builtin.template:
        src: templates/pg_hba.conf.j2
        dest: "{{ postgresql_hba_path }}"
        owner: "{{ postgresql_admin_user }}"
        group: "{{ postgresql_admin_user }}"
        mode: '0640'
      notify: Restart PostgreSQL
      tags: [configure]

    - name: Set password for the PostgreSQL admin user
      become: true
      become_user: "{{ postgresql_admin_user }}"
      community.postgresql.postgresql_user:
        name: "{{ postgresql_admin_user }}"
        password: "{{ postgresql_admin_password }}"
        encrypted: true
        state: present
      no_log: true
      tags: [configure]

  handlers:
    - name: Restart PostgreSQL
      ansible.builtin.systemd_service:
        name: "{{ postgresql_service_name }}"
        state: restarted
