---
# PostgreSQL major version to install/manage.
# Supported: 15, 16, 17, 18 (see README Notes for per-version EOL dates).
postgresql_version: 17

postgresql_port: 5432
postgresql_encoding: "UTF-8"
postgresql_locale: "en_US.UTF-8"

# Address(es) PostgreSQL listens on (postgresql.conf listen_addresses).
postgresql_listen_addresses: "*"

# Auth method written into pg_hba.conf for network connections.
# md5 is deprecated upstream since PG14; scram-sha-256 is the PG14+ default.
postgresql_hba_auth_method: "scram-sha-256"

# Networks allowed to authenticate over TCP with postgresql_hba_auth_method.
# Replace with your real application subnet(s) before production use.
postgresql_hba_networks:
  - 10.0.0.0/8

postgresql_admin_user: "postgres"

# Vault-backed secret. Never commit a real value here.
# Provide via: ansible-vault encrypt_string, or -e vault_postgresql_admin_password=...
postgresql_admin_password: "{{ vault_postgresql_admin_password | default('') }}"

# Per-OS-family layout. RHEL/Suse config files live inside the data directory
# (created by initdb); Debian keeps config separate from data (postgresql-common).
postgresql_paths:
  Debian:
    data_dir: "/var/lib/postgresql/{{ postgresql_version }}/main"
    conf: "/etc/postgresql/{{ postgresql_version }}/main/postgresql.conf"
    hba: "/etc/postgresql/{{ postgresql_version }}/main/pg_hba.conf"
    service: "postgresql@{{ postgresql_version }}-main"
  RedHat:
    data_dir: "/var/lib/pgsql/{{ postgresql_version }}/data"
    conf: "/var/lib/pgsql/{{ postgresql_version }}/data/postgresql.conf"
    hba: "/var/lib/pgsql/{{ postgresql_version }}/data/pg_hba.conf"
    service: "postgresql-{{ postgresql_version }}"
  Suse:
    # Packaging mirrors the RHEL/PGDG layout; service/initdb unit name is UNVERIFIED
    # upstream (see README Notes) but follows the same convention.
    data_dir: "/var/lib/pgsql/{{ postgresql_version }}/data"
    conf: "/var/lib/pgsql/{{ postgresql_version }}/data/postgresql.conf"
    hba: "/var/lib/pgsql/{{ postgresql_version }}/data/pg_hba.conf"
    service: "postgresql-{{ postgresql_version }}"

postgresql_conf_path: "{{ postgresql_paths[ansible_os_family].conf }}"
postgresql_hba_path: "{{ postgresql_paths[ansible_os_family].hba }}"
postgresql_data_dir: "{{ postgresql_paths[ansible_os_family].data_dir }}"
postgresql_service_name: "{{ postgresql_paths[ansible_os_family].service }}"

# Target-host python driver package required by community.postgresql modules.
postgresql_python_package:
  Debian: python3-psycopg2
  RedHat: python3-psycopg2
  Suse: python311-psycopg2

# uninstall.yml: also delete the data directory. Defaults to false (destructive).
postgresql_uninstall_purge_data: false
