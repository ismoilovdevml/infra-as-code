---
# Single entry point. Fans firewall_rules (vars.yml) out to the correct backend
# per host: ufw on Debian/Ubuntu, firewalld on RHEL/Rocky/Alma/Fedora/SUSE.
# ufw.yml and firewalld.yml stay independently runnable for a single-family
# inventory; each one guards its own tasks with ansible_os_family.
- name: Assert supported platform
  hosts: all
  become: true
  gather_facts: true
  tasks:
    - name: Assert the OS family is supported
      ansible.builtin.assert:
        that:
          - ansible_os_family in ['Debian', 'RedHat', 'Suse']
        fail_msg: >-
          {{ ansible_distribution }} {{ ansible_distribution_version }}
          ({{ ansible_os_family }}) is not supported by this firewall module.
          Supported: Debian/Ubuntu (ufw), RHEL/Rocky/Alma/Fedora/CentOS Stream/SUSE
          (firewalld).
        quiet: true
      tags: [always]

- name: Apply UFW rules (Debian/Ubuntu)
  ansible.builtin.import_playbook: ufw.yml

- name: Apply firewalld rules (RHEL/SUSE)
  ansible.builtin.import_playbook: firewalld.yml
