---
# UFW management for Debian/Ubuntu. Importable standalone (`ansible-playbook
# ufw.yml`) or via configure.yml, which dispatches by OS family. Every task is
# gated on ansible_os_family so this file is a safe no-op on non-Debian hosts.
- name: Manage UFW on Debian/Ubuntu
  hosts: all
  become: true
  gather_facts: true
  vars_files:
    - vars.yml

  tasks:
    # CRITICAL SAFETY: refuse to run if there is no SSH allow rule. Applying a
    # default-deny incoming policy without one locks out the current connection.
    - name: Assert firewall_rules includes an SSH allow rule
      ansible.builtin.assert:
        that:
          - firewall_rules
              | selectattr('rule', 'equalto', 'allow')
              | map(attribute='port') | map('string') | list
              | intersect([firewall_ssh_port | string])
              | length > 0
        fail_msg: >-
          firewall_rules has no allow rule for port {{ firewall_ssh_port }} (SSH).
          Applying a default-deny incoming policy without an SSH allow rule locks
          out the current connection. Add one to firewall_rules before running
          this play.
        quiet: true
      when: ansible_os_family == 'Debian'
      tags: [always]

    - name: Install ufw
      ansible.builtin.apt:
        name: ufw
        state: present
        update_cache: true
        cache_valid_time: 3600
      when:
        - ansible_os_family == 'Debian'
        - firewall_install | bool
      tags: [install]

    # Allow rules are applied first and unconditionally: they only ever widen
    # access, so staging them before the default policy changes is always safe
    # and is what keeps the SSH session alive once incoming traffic is denied.
    - name: Apply allow rules
      community.general.ufw:
        rule: allow
        proto: "{{ item.proto | default('tcp') }}"
        port: "{{ item.port | string }}"
        from_ip: "{{ item.src | default('any') }}"
        comment: "{{ item.name | default(omit) }}"
      loop: "{{ firewall_rules | selectattr('rule', 'equalto', 'allow') | list }}"
      loop_control:
        label: "{{ item.name | default(item.port) }}"
      when: ansible_os_family == 'Debian'
      tags: [configure]

    - name: Apply deny rules
      community.general.ufw:
        rule: deny
        proto: "{{ item.proto | default('tcp') }}"
        port: "{{ item.port | string }}"
        from_ip: "{{ item.src | default('any') }}"
        comment: "{{ item.name | default(omit) }}"
      loop: "{{ firewall_deny_rules }}"
      loop_control:
        label: "{{ item.name | default(item.port) }}"
      when: ansible_os_family == 'Debian'
      tags: [configure]

    - name: Set default outgoing policy
      community.general.ufw:
        default: "{{ firewall_default_outgoing }}"
        direction: outgoing
      when: ansible_os_family == 'Debian'
      tags: [configure]

    # Incoming default-deny is applied last, after every allow/deny rule above
    # is already in place — never before the SSH allow rule exists.
    - name: Set default incoming policy
      community.general.ufw:
        default: "{{ firewall_default_incoming }}"
        direction: incoming
      when: ansible_os_family == 'Debian'
      tags: [configure]

    - name: Set logging level
      community.general.ufw:
        logging: "{{ ufw_logging }}"
      when: ansible_os_family == 'Debian'
      tags: [configure]

    - name: Enable ufw
      community.general.ufw:
        state: enabled
      when:
        - ansible_os_family == 'Debian'
        - firewall_enable | bool
      tags: [service]

    - name: Read ufw status
      ansible.builtin.command: ufw status verbose
      register: firewall_ufw_status
      changed_when: false
      check_mode: false
      when: ansible_os_family == 'Debian'
      tags: [verify]

    - name: Show ufw status
      ansible.builtin.debug:
        var: firewall_ufw_status.stdout_lines
      when: ansible_os_family == 'Debian'
      tags: [verify]
