---
# Re-renders /etc/promtail/config.yml on hosts where install_promtail.yml already deployed the
# grafana.grafana.promtail role, and restarts the service if the rendered file changed.
# Promtail is END OF LIFE upstream since 2026-03-02 — see README.md.
- name: Configure Promtail
  hosts: promtail_servers
  become: true

  vars_files:
    - vars.yml

  handlers:
    - name: Restart promtail service
      ansible.builtin.systemd_service:
        name: promtail
        state: restarted

  pre_tasks:
    - name: Assert supported platform
      ansible.builtin.assert:
        that:
          - ansible_os_family in ['Debian', 'RedHat']
        fail_msg: >-
          {{ ansible_distribution }} {{ ansible_distribution_version }} is not supported by
          this playbook.
        quiet: true
      tags: always

  tasks:
    - name: Template Promtail configuration file
      ansible.builtin.template:
        src: "{{ promtail_config_template }}"
        dest: /etc/promtail/config.yml
        owner: root
        group: root
        mode: '0644'
      notify: Restart promtail service
      tags: configure
