---
# Re-renders the Promtail config on hosts running the Docker-based deployment
# (install_promtail_docker.yml) and restarts the container if the file changed.
# Promtail is END OF LIFE upstream since 2026-03-02 — see README.md.
- name: Configure Promtail (Docker)
  hosts: promtail_servers
  become: true

  vars_files:
    - vars.yml

  handlers:
    - name: Restart promtail container
      community.docker.docker_container:
        name: promtail
        state: started
        restart: true

  pre_tasks:
    - name: Assert supported platform
      ansible.builtin.assert:
        that:
          - ansible_os_family in ['Debian', 'RedHat', 'Suse']
        fail_msg: >-
          {{ ansible_distribution }} {{ ansible_distribution_version }} is not supported by
          this playbook.
        quiet: true
      tags: always

  tasks:
    - name: Template Promtail configuration file
      ansible.builtin.template:
        src: "{{ promtail_config_template }}"
        dest: "{{ promtail_docker_config_dir }}/config.yml"
        owner: root
        group: root
        mode: '0644'
      notify: Restart promtail container
      tags: configure
