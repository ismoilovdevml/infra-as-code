---
# RabbitMQ 4.3.x requires Erlang/OTP 27.x. Erlang and RabbitMQ MUST come from the same
# paired Team RabbitMQ repository generation — mixing distro-default Erlang (EPEL,
# Debian main) with the vendor RabbitMQ package is the most common "node won't start"
# failure. https://www.rabbitmq.com/docs/which-erlang
#
# Current stable series: 4.3 (latest patch 4.3.4, 2026-07-23). Tracked here for
# documentation only — the package tasks intentionally do not pin an exact version,
# letting apt/dnf install whatever the paired repo currently serves.
rabbitmq_series: "4.3"

# --- Debian/Ubuntu apt repository (Team RabbitMQ, Cloudsmith-backed) -----------
# https://www.rabbitmq.com/docs/install-debian
# The old ppa.novemberain.com / ppa1/ppa2.novemberain.com hostnames and the
# packagecloud.io/rabbitmq/rabbitmq-server RPM path are retired; current docs only
# reference deb1/deb2.rabbitmq.com and yum1/yum2.rabbitmq.com.
rabbitmq_apt_keyring: /etc/apt/keyrings/com.rabbitmq.team.asc
rabbitmq_apt_key_url: "https://keys.openpgp.org/vks/v1/by-fingerprint/0A9AF2115F4687BD29803A206B73A36E6026DFCA"
# Two mirrors are added for redundancy, matching upstream's own quick-start script.
rabbitmq_apt_mirrors:
  - deb1.rabbitmq.com
  - deb2.rabbitmq.com
# Repo path segment is the lower-cased distribution name (debian|ubuntu), confirmed
# against upstream's own examples for both.
rabbitmq_apt_repo_os: "{{ ansible_distribution | lower }}"
rabbitmq_apt_suite: "{{ ansible_distribution_release }}"
# Upstream states this apt repository only publishes amd64 packages; arm64 Debian/Ubuntu
# needs the Launchpad PPA path instead (not implemented by this playbook).
rabbitmq_apt_arch: amd64

# --- RHEL/Rocky/Alma/Fedora/Amazon yum repository ------------------------------
# https://www.rabbitmq.com/docs/install-rpm
rabbitmq_rpm_signing_keys:
  - https://github.com/rabbitmq/signing-keys/releases/download/3.0/rabbitmq-release-signing-key.asc
  - https://github.com/rabbitmq/signing-keys/releases/download/3.0/cloudsmith.rabbitmq-erlang.E495BB49CC4BBE5B.key
  - https://github.com/rabbitmq/signing-keys/releases/download/3.0/cloudsmith.rabbitmq-server.9F4587F226208342.key
rabbitmq_yum_erlang_baseurl: "https://yum1.rabbitmq.com/erlang/el/{{ ansible_distribution_major_version }}/$basearch"
rabbitmq_yum_server_baseurl: "https://yum2.rabbitmq.com/rabbitmq/el/{{ ansible_distribution_major_version }}/$basearch"

# --- packages / service ---------------------------------------------------------
# The "erlang" meta package pulls every erlang-* component RabbitMQ needs; simpler
# and just as version-matched as installing the components individually.
rabbitmq_erlang_package: erlang
rabbitmq_package_name: rabbitmq-server
rabbitmq_service_name: rabbitmq-server

rabbitmq_conf_dir: /etc/rabbitmq
rabbitmq_data_dir: /var/lib/rabbitmq
rabbitmq_log_dir: /var/log/rabbitmq

# --- networking -------------------------------------------------------------
# https://www.rabbitmq.com/docs/networking
rabbitmq_listen_address: "0.0.0.0"
rabbitmq_amqp_port: 5672
rabbitmq_management_port: 15672
rabbitmq_dist_port: 25672      # inter-node/CLI (Erlang distribution); firewall to peers
rabbitmq_epmd_port: 4369       # peer discovery; firewall to peers

rabbitmq_management_plugin_enabled: true

# --- admin user ---------------------------------------------------------------
# The default guest/guest account is restricted by upstream to loopback connections
# only and is left untouched here (do NOT set loopback_users.guest = false in
# rabbitmq.conf unless its password is also changed). Production traffic should use
# this vault-backed admin user instead.
rabbitmq_admin_user: admin
rabbitmq_admin_password: "{{ vault_rabbitmq_admin_password | default('') }}"
rabbitmq_admin_vhost: /

# uninstall.yml: also delete data/config, not just packages.
rabbitmq_purge_data: false

# --- docker.yml / cleanup_docker.yml -------------------------------------------
# Independent path: runs RabbitMQ in a container instead of installing packages.
rabbitmq_docker_image: "4.3-management"
rabbitmq_docker_container_name: rabbitmq
rabbitmq_docker_amqp_host_port: 5672
rabbitmq_docker_management_host_port: 15672
rabbitmq_docker_data_path: /var/lib/rabbitmq_docker_data
rabbitmq_docker_admin_user: admin
rabbitmq_docker_admin_password: "{{ vault_rabbitmq_docker_admin_password | default('') }}"
