---
- name: Install RabbitMQ using Docker
  hosts: rabbitmq_servers
  become: true
  gather_facts: true
  vars_files:
    - vars.yml

  tasks:
    - name: Assert the admin password is set
      ansible.builtin.assert:
        that:
          - rabbitmq_docker_admin_password | length > 0
        fail_msg: >-
          rabbitmq_docker_admin_password is empty. Set
          vault_rabbitmq_docker_admin_password via ansible-vault before running
          this playbook.
        quiet: true
      tags: [always]

    # `command -v` requires a shell, so this uses ansible.builtin.command against
    # `which` instead of ansible.builtin.shell.
    - name: Check whether Docker is installed
      ansible.builtin.command: which docker
      register: rabbitmq_docker_check
      changed_when: false
      failed_when: false
      check_mode: false
      tags: [always]

    - name: Assert Docker is present
      ansible.builtin.assert:
        that:
          - rabbitmq_docker_check.rc == 0
        fail_msg: >-
          Docker is not installed on {{ inventory_hostname }}. Install it first
          (see ../docker/install_docker.yml).
        quiet: true
      tags: [always]

    - name: Create the host path directory for RabbitMQ data
      ansible.builtin.file:
        path: "{{ rabbitmq_docker_data_path }}"
        state: directory
        mode: '0750'
        owner: root
        group: root
      tags: [install]

    - name: Start the RabbitMQ container
      community.docker.docker_container:
        name: "{{ rabbitmq_docker_container_name }}"
        image: "rabbitmq:{{ rabbitmq_docker_image }}"
        state: started
        restart_policy: unless-stopped
        ports:
          - "{{ rabbitmq_docker_amqp_host_port }}:5672"
          - "{{ rabbitmq_docker_management_host_port }}:15672"
        env:
          RABBITMQ_DEFAULT_USER: "{{ rabbitmq_docker_admin_user }}"
          RABBITMQ_DEFAULT_PASS: "{{ rabbitmq_docker_admin_password }}"
        volumes:
          - "{{ rabbitmq_docker_data_path }}:/var/lib/rabbitmq"
      no_log: true
      tags: [install]

    - name: Wait for the management port
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ rabbitmq_docker_management_host_port }}"
        timeout: 90
      tags: [verify]

    - name: Check RabbitMQ health status
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ rabbitmq_docker_management_host_port }}/api/healthchecks/node"
        method: GET
        user: "{{ rabbitmq_docker_admin_user }}"
        password: "{{ rabbitmq_docker_admin_password }}"
        force_basic_auth: true
        status_code: 200
      register: rabbitmq_docker_health
      until: rabbitmq_docker_health.status == 200
      retries: 5
      delay: 10
      no_log: true
      check_mode: false
      tags: [verify]

    - name: Show the RabbitMQ container status
      ansible.builtin.debug:
        msg: >-
          RabbitMQ container {{ rabbitmq_docker_container_name }} is healthy.
          Management UI on port {{ rabbitmq_docker_management_host_port }}.
      tags: [verify]
