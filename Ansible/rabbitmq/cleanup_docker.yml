---
- name: Clean up the RabbitMQ Docker deployment
  hosts: rabbitmq_servers
  become: true
  gather_facts: false
  vars_files:
    - vars.yml

  tasks:
    - name: Stop the RabbitMQ container if it exists
      community.docker.docker_container:
        name: "{{ rabbitmq_docker_container_name }}"
        state: stopped
      failed_when: false
      tags: [uninstall]

    - name: Remove the RabbitMQ container if it exists
      community.docker.docker_container:
        name: "{{ rabbitmq_docker_container_name }}"
        state: absent
      failed_when: false
      tags: [uninstall]

    - name: Remove the RabbitMQ Docker image if it exists
      community.docker.docker_image:
        name: "rabbitmq:{{ rabbitmq_docker_image }}"
        state: absent
      failed_when: false
      tags: [uninstall]

    - name: Remove the RabbitMQ data directory
      ansible.builtin.file:
        path: "{{ rabbitmq_docker_data_path }}"
        state: absent
      when: rabbitmq_purge_data | bool
      tags: [uninstall]

    - name: Show cleanup completion message
      ansible.builtin.debug:
        msg: "RabbitMQ Docker cleanup completed."
      tags: [uninstall]
