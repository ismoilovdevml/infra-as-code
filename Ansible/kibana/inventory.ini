# The [elasticsearch] group below is the delegation target used to mint the
# Kibana enrollment token (elasticsearch-create-enrollment-token -s kibana).
# It must already be running a configured Elasticsearch node - see
# ../elasticsearch/. It does not need to be the full ES cluster, one
# reachable node is enough.

[elasticsearch]
es-node1 ansible_host=10.0.0.11

[kibana]
kibana-node1 ansible_host=10.0.0.21

[kibana:vars]
ansible_user=ubuntu
ansible_ssh_private_key_file=~/.ssh/id_ed25519
