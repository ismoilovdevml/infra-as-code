---
# Semaphore UI (formerly Ansible Semaphore).
semaphore_version: "2.18.29"
semaphore_repo: "https://github.com/semaphoreui/semaphore/releases/download"

# "package" installs the upstream .deb/.rpm; "binary" the tarball; "docker" the image.
semaphore_install_method: package

semaphore_user: semaphore
semaphore_group: semaphore
semaphore_config_dir: /etc/semaphore
semaphore_data_dir: /var/lib/semaphore
semaphore_tmp_dir: /tmp/semaphore
semaphore_install_dir: /opt/semaphore          # binary method only

semaphore_port: 3000
# Bind to loopback and front with a reverse proxy for anything public.
semaphore_bind_address: "0.0.0.0"

# Release assets use Go arch names, not uname -m.
semaphore_arch_map:
  x86_64: amd64
  aarch64: arm64
  armv7l: arm
  i386: "386"
  ppc64le: ppc64le

# --- database -----------------------------------------------------------------
# bolt (embedded, single node only) | mysql | postgres
semaphore_db_dialect: bolt
semaphore_db_host: "127.0.0.1"
semaphore_db_port: 5432
semaphore_db_name: semaphore
semaphore_db_user: semaphore
semaphore_db_password: "{{ vault_semaphore_db_password | default('') }}"

# --- secrets ------------------------------------------------------------------
# Vault-backed. Never commit real values.
semaphore_admin_name: admin
semaphore_admin_email: "admin@example.com"
semaphore_admin_password: "{{ vault_semaphore_admin_password | default('') }}"

# CRITICAL: this key encrypts every SSH key, password and credential Semaphore
# stores. Anyone holding it plus a database dump can decrypt all of them, and
# rotating it invalidates everything already encrypted.
# Generate with:  head -c32 /dev/urandom | base64
semaphore_access_key_encryption: "{{ vault_semaphore_access_key_encryption | default('') }}"

# --- docker method ------------------------------------------------------------
semaphore_image: "semaphoreui/semaphore:v{{ semaphore_version }}"
semaphore_container_name: semaphore
semaphore_restart_policy: unless-stopped

# uninstall.yml: also delete the database and playbook directories.
semaphore_purge_data: false
