---
- name: Install the PMM Client from packages
  hosts: pmm_clients
  become: true
  gather_facts: true
  vars_files:
    - vars.yml

  tasks:
    - name: Assert the platform is supported
      ansible.builtin.assert:
        that:
          - ansible_os_family in ['Debian', 'RedHat']
        fail_msg: >-
          {{ ansible_distribution }} {{ ansible_distribution_version }} is not
          supported. Percona publishes repo.percona.com packages for
          Debian/Ubuntu and RHEL family only.
        quiet: true
      tags: [always]

    - name: Assert the admin password is set
      ansible.builtin.assert:
        that:
          - admin_password | length > 0
        fail_msg: >-
          admin_password is empty. Set vault_pmm_admin_password via
          ansible-vault before running this playbook.
        quiet: true
      tags: [always]

    # ------------------------------------------------------------- repo: Debian
    - name: Install the Percona release package (Debian family)
      ansible.builtin.apt:
        deb: "{{ percona_deb_repo_url }}"
        state: present
      when: ansible_os_family == 'Debian'
      tags: [install]

    # ------------------------------------------------------------- repo: RedHat
    - name: Install the Percona release package (RedHat family)
      ansible.builtin.dnf:
        name: "{{ percona_rpm_repo_url }}"
        state: present
        disable_gpg_check: true
      when: ansible_os_family == 'RedHat'
      tags: [install]

    # PMM 3's client packages are gated behind this component; installing
    # pmm-client without enabling it first only sees the PMM-2-era package set.
    - name: Enable the PMM 3 client repository component
      ansible.builtin.command: "percona-release enable {{ percona_release_pmm_component }}"
      register: pmm_percona_release
      changed_when: pmm_percona_release.rc == 0
      tags: [install]

    - name: Refresh the APT cache
      ansible.builtin.apt:
        update_cache: true
      when: ansible_os_family == 'Debian'
      tags: [install]

    - name: Install the PMM client package
      ansible.builtin.package:
        name: "{{ pmm_client_package }}"
        state: present
      tags: [install]

    - name: Verify the PMM client installation
      ansible.builtin.command: pmm-admin --version
      register: pmm_client_version
      changed_when: false
      check_mode: false
      tags: [verify]

    - name: Show the PMM client version
      ansible.builtin.debug:
        msg: "PMM Client version: {{ pmm_client_version.stdout }}"
      tags: [verify]

    # pmm-admin config is idempotent by design (it re-registers the node), so
    # no additional guard is required here.
    - name: Configure the PMM client to connect to the PMM Server
      ansible.builtin.command:
        cmd: >-
          pmm-admin config --server-insecure-tls
          --server-url=https://{{ pmm_server_username }}:{{ admin_password }}@{{ pmm_server_address }}
          {{ inventory_hostname }} --force
      register: pmm_config_output
      changed_when: false
      no_log: true
      tags: [configure]

    - name: Show the PMM client configuration result
      ansible.builtin.debug:
        msg: "PMM Client configuration result: {{ pmm_config_output.stdout }}"
      tags: [configure]
