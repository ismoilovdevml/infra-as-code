---
- name: Deploy PMM Server with Docker
  hosts: pmm_servers
  become: true
  gather_facts: true
  vars_files:
    - vars.yml

  tasks:
    - name: Assert the admin password is set
      ansible.builtin.assert:
        that:
          - admin_password | length > 0
        fail_msg: >-
          admin_password is empty. Set vault_pmm_admin_password via
          ansible-vault before running this playbook.
        quiet: true
      tags: [always]

    # `command -v` requires a shell, so this uses ansible.builtin.command
    # against `which` instead of ansible.builtin.shell.
    - name: Check whether Docker is installed
      ansible.builtin.command: which docker
      register: pmm_docker_check
      changed_when: false
      failed_when: false
      check_mode: false
      tags: [always]

    - name: Assert Docker is present
      ansible.builtin.assert:
        that:
          - pmm_docker_check.rc == 0
        fail_msg: >-
          Docker is not installed on {{ inventory_hostname }}. Install it first
          (see ../docker/install_docker.yml).
        quiet: true
      tags: [always]

    - name: Create the PMM data directory
      ansible.builtin.file:
        path: "{{ pmm_data_dir }}"
        state: directory
        mode: '0750'
      tags: [install]

    - name: Pull the PMM Server image
      community.docker.docker_image:
        name: "{{ pmm_image }}"
        source: pull
      tags: [install]

    - name: Run the PMM Server container
      community.docker.docker_container:
        name: "{{ pmm_container_name }}"
        image: "{{ pmm_image }}"
        state: started
        restart_policy: always
        ports:
          - "{{ pmm_server_host_port }}:{{ pmm_server_container_port }}"
        volumes:
          - "{{ pmm_data_dir }}:/srv"
      register: pmm_container
      tags: [install]

    - name: Wait for PMM Server to accept connections
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ pmm_server_host_port }}"
        timeout: 120
      tags: [install]

    # change-admin-password is not idempotent against an already-changed
    # password, so it is guarded by a marker file on the bind-mounted data
    # directory rather than re-run (and potentially rejected) on every play.
    - name: Set the PMM admin password
      ansible.builtin.shell:
        cmd: >-
          docker exec -t {{ pmm_container_name }} change-admin-password {{ admin_password }}
          && touch {{ pmm_data_dir }}/.admin_password_set
        creates: "{{ pmm_data_dir }}/.admin_password_set"
      no_log: true
      tags: [configure]

    - name: Confirm PMM Server is running
      ansible.builtin.uri:
        url: "https://127.0.0.1:{{ pmm_server_host_port }}"
        status_code: 200
        validate_certs: false
      register: pmm_status
      retries: 5
      delay: 10
      until: pmm_status.status == 200
      check_mode: false
      tags: [verify]
