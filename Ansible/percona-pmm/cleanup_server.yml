---
- name: Uninstall the PMM Server Docker deployment
  hosts: pmm_servers
  become: true
  gather_facts: false
  vars_files:
    - vars.yml

  tasks:
    - name: Stop the PMM Server container if it exists
      community.docker.docker_container:
        name: "{{ pmm_container_name }}"
        state: stopped
      failed_when: false
      tags: [uninstall]

    - name: Remove the PMM Server container if it exists
      community.docker.docker_container:
        name: "{{ pmm_container_name }}"
        state: absent
      failed_when: false
      tags: [uninstall]

    - name: Remove the PMM Server Docker image if it exists
      community.docker.docker_image:
        name: "{{ pmm_image }}"
        state: absent
      failed_when: false
      tags: [uninstall]

    - name: Remove the PMM data directory
      ansible.builtin.file:
        path: "{{ pmm_data_dir }}"
        state: absent
      when: pmm_purge_data | bool
      tags: [uninstall]
