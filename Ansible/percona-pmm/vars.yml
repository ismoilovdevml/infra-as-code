---
# PMM 2 reached EOL on 2025-10-31; this module targets PMM 3.
# https://forums.percona.com/t/pmm2-client-pmm3/38432

# --- PMM Server (pmm_server.yml / cleanup_server.yml) ---------------------------
# 3.x listens internally on 8443 (not 443, which was the PMM 2 layout).
pmm_image: "percona/pmm-server:3"
pmm_data_dir: "/srv/pmm"
pmm_container_name: "pmm-server"
pmm_server_host_port: 443
pmm_server_container_port: 8443
pmm_server_address: "10.0.0.20:443"   # placeholder — set to the real PMM Server address
pmm_server_username: "admin"
admin_password: "{{ vault_pmm_admin_password | default('') }}"
pmm_server_insecure_tls: "1"

# --- PMM Client, Docker path (pmm_client_with_docker.yml / cleanup_client_docker.yml)
pmm_client_docker_image: "percona/pmm-client"
pmm_client_docker_tag: "3"
pmm_client_container: "pmm-client"
pmm_data_host_path: "/mnt/pmm-data"
pmm_agent_config_file: "config/pmm-agent.yaml"

# --- PMM Client, package path (pmm_client_with_package.yml / cleanup_package.yml)
percona_deb_repo_url: "https://repo.percona.com/apt/percona-release_latest.generic_all.deb"
percona_rpm_repo_url: "https://repo.percona.com/yum/percona-release-latest.noarch.rpm"
# The PMM-3-specific percona-release component. Installing pmm-client without
# enabling this first only sees the (non-existent under this name) PMM 2 set.
percona_release_pmm_component: "pmm3-client"
pmm_client_package: "pmm-client"

# --- PostgreSQL monitoring (pmm_postgresql.yml) ----------------------------------
postgresql_version: 17
postgresql_admin_user: "postgres"
postgresql_admin_password: "{{ vault_postgresql_admin_password | default('') }}"
pmm_postgresql_user: "pmm"
pmm_postgresql_password: "{{ vault_pmm_postgresql_password | default('') }}"

# Debian/Ubuntu (postgresql-common layout) vs RHEL family (upstream PGDG/Percona
# layout) — these differ, unlike the previous vars.yml which used the Debian
# path for both.
postgresql_conf_path_debian: "/etc/postgresql/{{ postgresql_version }}/main/postgresql.conf"
pg_hba_conf_path_debian: "/etc/postgresql/{{ postgresql_version }}/main/pg_hba.conf"
postgresql_service_name_debian: "postgresql"

postgresql_conf_path_redhat: "/var/lib/pgsql/{{ postgresql_version }}/data/postgresql.conf"
pg_hba_conf_path_redhat: "/var/lib/pgsql/{{ postgresql_version }}/data/pg_hba.conf"
postgresql_service_name_redhat: "postgresql-{{ postgresql_version }}"

postgresql_conf_path: "{{ postgresql_conf_path_debian if ansible_os_family == 'Debian' else postgresql_conf_path_redhat }}"
pg_hba_conf_path: "{{ pg_hba_conf_path_debian if ansible_os_family == 'Debian' else pg_hba_conf_path_redhat }}"
postgresql_service_name: "{{ postgresql_service_name_debian if ansible_os_family == 'Debian' else postgresql_service_name_redhat }}"

pg_extensions:
  - pg_stat_statements
  - pg_stat_monitor

# uninstall/cleanup playbooks: also delete data directories.
pmm_purge_data: false
