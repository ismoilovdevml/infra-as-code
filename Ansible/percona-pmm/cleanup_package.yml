---
- name: Uninstall the PMM Client package
  hosts: pmm_clients
  become: true
  gather_facts: true
  vars_files:
    - vars.yml

  tasks:
    - name: Remove the PMM client package (Debian family)
      ansible.builtin.apt:
        name: "{{ pmm_client_package }}"
        state: absent
        purge: "{{ pmm_purge_data }}"
      when: ansible_os_family == 'Debian'
      tags: [uninstall]

    - name: Clean the APT cache (Debian family)
      ansible.builtin.apt:
        autoclean: true
      when: ansible_os_family == 'Debian'
      tags: [uninstall]

    - name: Remove the PMM client package (RedHat family)
      ansible.builtin.dnf:
        name: "{{ pmm_client_package }}"
        state: absent
      when: ansible_os_family == 'RedHat'
      tags: [uninstall]

    - name: Clean the DNF cache (RedHat family)
      ansible.builtin.command: dnf clean all
      changed_when: false
      when: ansible_os_family == 'RedHat'
      tags: [uninstall]

    - name: Verify the PMM client has been removed
      ansible.builtin.command: pmm-admin --version
      register: pmm_client_removal_check
      failed_when: pmm_client_removal_check.rc == 0
      changed_when: false
      tags: [verify]
