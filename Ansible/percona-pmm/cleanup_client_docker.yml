---
- name: Uninstall the PMM Client Docker deployment
  hosts: pmm_clients
  become: true
  gather_facts: false
  vars_files:
    - vars.yml

  tasks:
    - name: Stop the PMM client container if it exists
      community.docker.docker_container:
        name: "{{ pmm_client_container }}"
        state: stopped
      failed_when: false
      tags: [uninstall]

    - name: Remove the PMM client container if it exists
      community.docker.docker_container:
        name: "{{ pmm_client_container }}"
        state: absent
      failed_when: false
      tags: [uninstall]

    - name: Remove the PMM client Docker image if it exists
      community.docker.docker_image:
        name: "{{ pmm_client_docker_image }}"
        tag: "{{ pmm_client_docker_tag }}"
        state: absent
      failed_when: false
      tags: [uninstall]

    - name: Remove the PMM client data directory
      ansible.builtin.file:
        path: "{{ pmm_data_host_path }}"
        state: absent
      when: pmm_purge_data | bool
      tags: [uninstall]
