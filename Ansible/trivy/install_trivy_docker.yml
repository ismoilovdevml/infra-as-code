---
- name: Run a Trivy vulnerability scan via Docker
  hosts: trivy_servers
  become: true
  gather_facts: true
  vars_files:
    - vars.yml

  tasks:
    # ---------------------------------------------------------------- preflight
    - name: Check whether Docker is installed
      ansible.builtin.command: which docker
      register: trivy_docker_present
      changed_when: false
      failed_when: false
      check_mode: false
      tags: [always]

    - name: Fail fast when Docker is not installed
      ansible.builtin.fail:
        msg: >-
          Docker is required for install_trivy_docker.yml but was not found on
          {{ inventory_hostname }}. Install it first (see the docker module in this
          repository), or use install_trivy_os.yml / install_trivy_binary.yml instead.
      when: trivy_docker_present.rc != 0
      tags: [always]

    - name: Create the Trivy cache directory
      ansible.builtin.file:
        path: "{{ trivy_docker_cache_dir }}"
        state: directory
        mode: '0750'
      tags: [install]

    - name: Pull the Trivy image
      community.docker.docker_image:
        name: "{{ trivy_docker_image_repo }}"
        tag: "{{ trivy_docker_image_tag }}"
        source: pull
      tags: [install]

    # ------------------------------------------------------------------- verify
    - name: Run a Trivy image scan
      community.docker.docker_container:
        name: trivy_scan
        image: "{{ trivy_docker_image_repo }}:{{ trivy_docker_image_tag }}"
        command: "image {{ trivy_docker_scan_target }}"
        volumes:
          - "{{ trivy_docker_cache_dir }}:/root/.cache/"
          - /var/run/docker.sock:/var/run/docker.sock
        detach: false
        cleanup: true
        output_logs: true
      register: trivy_scan
      changed_when: true
      tags: [verify]

    - name: Show the scan result
      ansible.builtin.debug:
        msg: "{{ trivy_scan.container.Output | default(trivy_scan.stdout) | default('see container logs') }}"
      tags: [verify]
