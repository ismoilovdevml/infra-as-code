---
- name: Install the Trivy Helm chart
  hosts: trivy_helm_hosts
  become: false
  gather_facts: true
  vars_files:
    - vars.yml

  tasks:
    # ---------------------------------------------------------------- preflight
    - name: Check whether Helm is installed
      ansible.builtin.command: which helm
      register: trivy_helm_present
      changed_when: false
      failed_when: false
      check_mode: false
      tags: [always]

    - name: Fail fast when Helm is not installed
      ansible.builtin.fail:
        msg: >-
          Helm is required for install_trivy_helm.yml but was not found on
          {{ inventory_hostname }}. Install Helm and configure kubectl access to the
          target cluster before running this play.
      when: trivy_helm_present.rc != 0
      tags: [always]

    - name: Add the Aqua Security Helm repository
      kubernetes.core.helm_repository:
        name: "{{ trivy_helm_repo_name }}"
        repo_url: "{{ trivy_helm_repo_url }}"
      tags: [install]

    - name: Install/upgrade the Trivy chart
      kubernetes.core.helm:
        name: "{{ trivy_helm_release_name }}"
        chart_ref: "{{ trivy_helm_chart }}"
        chart_version: "{{ trivy_helm_chart_version | default(omit, true) }}"
        release_namespace: "{{ trivy_helm_namespace }}"
        create_namespace: "{{ trivy_helm_create_namespace }}"
        update_repo_cache: true
        wait: true
      tags: [install]

    # ------------------------------------------------------------------- verify
    - name: Show the release status
      kubernetes.core.helm_info:
        name: "{{ trivy_helm_release_name }}"
        release_namespace: "{{ trivy_helm_namespace }}"
      register: trivy_helm_status
      changed_when: false
      tags: [verify]

    - name: Display the release status
      ansible.builtin.debug:
        msg: "{{ trivy_helm_status.status.status | default('unknown') }}"
      tags: [verify]
