# install_trivy_os.yml / install_trivy_binary.yml / install_trivy_docker.yml
[trivy_servers]
node1 ansible_host=10.0.0.11
node2 ansible_host=10.0.0.12

# install_trivy_helm.yml — a single host with kubectl/helm already configured
# against the target Kubernetes cluster (a bastion/control host, not a cluster node).
[trivy_helm_hosts]
k8s-control ansible_host=10.0.0.20

[trivy_servers:vars]
ansible_user=ubuntu
ansible_ssh_private_key_file=~/.ssh/id_ed25519

[trivy_helm_hosts:vars]
ansible_user=ubuntu
ansible_ssh_private_key_file=~/.ssh/id_ed25519
