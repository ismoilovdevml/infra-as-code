---
# Destructive. Stops and removes the Nexus container. When nexus_purge_data is true,
# also removes the data directory (all repositories, blobs and configuration).
- name: Uninstall Nexus Repository (Docker)
  hosts: nexus_servers
  become: true
  gather_facts: true
  vars_files:
    - vars.yml

  tasks:
    - name: Stop and remove the Nexus container
      community.docker.docker_container:
        name: "{{ nexus_container_name }}"
        state: absent
        stop_timeout: 30
      tags: [uninstall]

    - name: Remove the Nexus Docker image
      community.docker.docker_image:
        name: "{{ nexus_image }}"
        state: absent
      failed_when: false
      tags: [uninstall]

    - name: Remove the Nexus data directory
      ansible.builtin.file:
        path: "{{ nexus_data_dir }}"
        state: absent
      when: nexus_purge_data | bool
      tags: [uninstall]

    - name: Remove the Nexus parent directory
      ansible.builtin.file:
        path: "{{ nexus_parent_dir }}"
        state: absent
      when: nexus_purge_data | bool
      tags: [uninstall]
