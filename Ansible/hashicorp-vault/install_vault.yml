---
- name: Install HashiCorp Vault
  hosts: vault_nodes
  become: true
  gather_facts: true
  vars_files:
    - vars.yml

  handlers:
    - name: Refresh the APT cache
      ansible.builtin.apt:
        update_cache: true

  tasks:
    # ---------------------------------------------------------------- preflight
    - name: Preflight
      tags: [always]
      block:
        - name: Fail fast on unsupported platform
          ansible.builtin.fail:
            msg: >-
              {{ ansible_distribution }} {{ ansible_distribution_version }} is not
              supported by HashiCorp Vault packaging. Upstream publishes apt/yum repos
              only for Debian/Ubuntu and RHEL/CentOS/Rocky/AlmaLinux/Fedora/Amazon Linux.
              There is no official SUSE/zypper repository (hashicorp/vault#22890) and no
              Arch Linux package.
          when: ansible_os_family not in ['Debian', 'RedHat']

        - name: Assert the release is still supported upstream
          ansible.builtin.assert:
            that:
              - ansible_distribution_major_version | int >= vault_minimum_major_version[ansible_distribution]
            fail_msg: >-
              {{ ansible_distribution }} {{ ansible_distribution_version }} has been dropped from
              HashiCorp's current package support matrix. Minimum is {{ ansible_distribution }}
              {{ vault_minimum_major_version[ansible_distribution] }}.
              Set vault_strict_platform_check=false to install anyway.
            quiet: true
          when:
            - vault_strict_platform_check | bool
            - ansible_distribution in vault_minimum_major_version

    # ------------------------------------------------------------- repo: Debian
    - name: Configure the HashiCorp repository (Debian family)
      when: ansible_os_family == 'Debian'
      tags: [install]
      block:
        - name: Install the repository prerequisites
          ansible.builtin.apt:
            name:
              - ca-certificates
              - gnupg
              - python3-debian    # required by ansible.builtin.deb822_repository
            state: present
            update_cache: true
            cache_valid_time: 3600

        - name: Create the APT keyring directory
          ansible.builtin.file:
            path: /etc/apt/keyrings
            state: directory
            mode: '0755'

        # Fetched at install time on purpose: HashiCorp extends/rotates this key's
        # expiry from time to time (HCSEC-2026-03) without changing the fingerprint,
        # so pinning a local copy would go stale instead of tracking the source.
        - name: Fetch the HashiCorp GPG key
          ansible.builtin.get_url:
            url: https://apt.releases.hashicorp.com/gpg
            dest: /etc/apt/keyrings/hashicorp-archive-keyring.asc
            mode: '0644'

        - name: Add the HashiCorp repository
          ansible.builtin.deb822_repository:
            name: hashicorp
            types: [deb]
            uris: https://apt.releases.hashicorp.com
            suites: ["{{ ansible_distribution_release }}"]
            components: [main]
            architectures: ["{{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}"]
            signed_by: /etc/apt/keyrings/hashicorp-archive-keyring.asc
            enabled: true
            state: present
          notify: Refresh the APT cache

        - name: Refresh the APT cache before installing
          ansible.builtin.meta: flush_handlers

    # ------------------------------------------------------------- repo: RedHat
    - name: Configure the HashiCorp repository (RedHat family)
      when: ansible_os_family == 'RedHat'
      tags: [install]
      block:
        - name: Import the HashiCorp GPG key
          ansible.builtin.rpm_key:
            key: https://rpm.releases.hashicorp.com/gpg
            state: present

        - name: Add the HashiCorp repository
          ansible.builtin.yum_repository:
            name: hashicorp
            description: "HashiCorp Stable - $basearch"
            baseurl: >-
              {{ vault_rpm_baseurl_map[ansible_distribution] | default(vault_rpm_baseurl_default) }}
            gpgcheck: true
            repo_gpgcheck: true
            gpgkey: https://rpm.releases.hashicorp.com/gpg
            enabled: true

    # ------------------------------------------------------------------ install
    - name: Install Vault (Debian family)
      ansible.builtin.apt:
        name: "{{ vault_package_name if vault_version | length == 0 else vault_package_name ~ '=' ~ vault_version }}"
        state: present
      when: ansible_os_family == 'Debian'
      tags: [install]

    - name: Install Vault (RedHat family)
      ansible.builtin.dnf:
        name: "{{ vault_package_name if vault_version | length == 0 else vault_package_name ~ '-' ~ vault_version }}"
        state: present
      when: ansible_os_family == 'RedHat'
      tags: [install]

    # ------------------------------------------------------------------- verify
    - name: Collect the installed version
      ansible.builtin.command: vault --version
      register: vault_installed_version
      changed_when: false
      check_mode: false
      tags: [verify]

    - name: Show the installed version
      ansible.builtin.debug:
        msg: "{{ vault_installed_version.stdout }}"
      tags: [verify]
