# Raft integrated storage wants an odd number of voters. Three is the smallest
# sensible quorum; retry_join is computed from every OTHER host in this group.
[vault_nodes]
node1 ansible_host=10.0.0.11
node2 ansible_host=10.0.0.12
node3 ansible_host=10.0.0.13

[vault_nodes:vars]
ansible_user=ubuntu
ansible_ssh_private_key_file=~/.ssh/id_ed25519
