---
# Destructive. Stops and removes the SonarQube and PostgreSQL containers. When
# sonarqube_purge_data is true, also removes the named volumes (all SonarQube and
# database data) and the compose project directory.
- name: Uninstall SonarQube (Docker)
  hosts: sonarqube_servers
  become: true
  gather_facts: true
  vars_files:
    - vars.yml

  tasks:
    - name: Check whether the compose project exists
      ansible.builtin.stat:
        path: "{{ sonarqube_compose_file }}"
      register: sonarqube_compose_stat
      tags: [always]

    - name: Stop and remove the SonarQube and PostgreSQL stack
      community.docker.docker_compose_v2:
        project_src: "{{ sonarqube_compose_project_dir }}"
        state: absent
        remove_volumes: "{{ sonarqube_purge_data }}"
      when: sonarqube_compose_stat.stat.exists
      tags: [uninstall]

    - name: Remove the SonarQube compose project directory
      ansible.builtin.file:
        path: "{{ sonarqube_compose_project_dir }}"
        state: absent
      when: sonarqube_purge_data | bool
      tags: [uninstall]

    - name: Remove the SonarQube kernel tuning file
      ansible.builtin.file:
        path: /etc/sysctl.d/99-sonarqube.conf
        state: absent
      tags: [uninstall]
