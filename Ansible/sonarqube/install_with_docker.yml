---
- name: Install and configure SonarQube (Docker)
  hosts: sonarqube_servers
  become: true
  gather_facts: true
  vars_files:
    - vars.yml

  tasks:
    # ---------------------------------------------------------------- preflight
    - name: Assert the database password is set
      ansible.builtin.assert:
        that:
          - sonarqube_db_password | length > 0
        fail_msg: >-
          sonarqube_db_password (vault_sonarqube_db_password) is empty. Set it via
          ansible-vault before running this playbook.
        quiet: true
      no_log: true
      tags: [always]

    - name: Check whether Docker is installed
      ansible.builtin.command: docker version
      register: sonarqube_docker_check
      changed_when: false
      check_mode: false
      failed_when: false
      tags: [always]

    - name: Check whether the Docker Compose plugin is installed
      ansible.builtin.command: docker compose version
      register: sonarqube_compose_check
      changed_when: false
      check_mode: false
      failed_when: false
      tags: [always]

    - name: Assert Docker Engine and the Compose plugin are present
      ansible.builtin.assert:
        that:
          - sonarqube_docker_check.rc == 0
          - sonarqube_compose_check.rc == 0
        fail_msg: >-
          Docker Engine and the Compose plugin are required first — see the
          Ansible/docker module in this repository (install_docker.yml).
        quiet: true
      tags: [always]

    # ------------------------------------------------------------- kernel tuning
    # SonarQube embeds Elasticsearch, which requires these host kernel parameters.
    # The container shares the host kernel, so they must be set here, not inside it.
    # https://docs.sonarsource.com/sonarqube-server/2026.1/server-installation/pre-installation/linux
    - name: Set vm.max_map_count for the embedded Elasticsearch
      ansible.posix.sysctl:
        name: vm.max_map_count
        value: "{{ sonarqube_vm_max_map_count }}"
        sysctl_file: /etc/sysctl.d/99-sonarqube.conf
        sysctl_set: true
        state: present
        reload: true
      tags: [configure]

    - name: Set fs.file-max for the embedded Elasticsearch
      ansible.posix.sysctl:
        name: fs.file-max
        value: "{{ sonarqube_fs_file_max }}"
        sysctl_file: /etc/sysctl.d/99-sonarqube.conf
        sysctl_set: true
        state: present
        reload: true
      tags: [configure]

    # ---------------------------------------------------------------- compose file
    - name: Create the SonarQube compose project directory
      ansible.builtin.file:
        path: "{{ sonarqube_compose_project_dir }}"
        state: directory
        owner: root
        group: root
        mode: '0750'
      tags: [configure]

    - name: Write the docker-compose.yml
      ansible.builtin.template:
        src: docker-compose.yml.j2
        dest: "{{ sonarqube_compose_file }}"
        owner: root
        group: root
        mode: '0640'
      no_log: true
      tags: [configure]

    # ------------------------------------------------------------------- deploy
    # recreate defaults to "auto": containers are only recreated when their
    # rendered configuration (image, env, ports, ...) actually differs, so a
    # second run with no changes is a no-op.
    - name: Start the SonarQube and PostgreSQL stack
      community.docker.docker_compose_v2:
        project_src: "{{ sonarqube_compose_project_dir }}"
        state: present
        pull: missing
      tags: [install]

    # ------------------------------------------------------------------- verify
    - name: Wait for the SonarQube HTTP port
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ sonarqube_port }}"
        timeout: 300
      tags: [verify]

    - name: Check the SonarQube system status
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ sonarqube_port }}/api/system/status"
        status_code: 200
      register: sonarqube_status
      until: sonarqube_status.json.status in ['UP', 'STARTING', 'DB_MIGRATION_NEEDED', 'DB_MIGRATION_RUNNING']
      retries: 30
      delay: 10
      changed_when: false
      check_mode: false
      tags: [verify]

    - name: Show the SonarQube status
      ansible.builtin.debug:
        msg: >-
          SonarQube is {{ sonarqube_status.json.status }} on port {{ sonarqube_port }}.
          Default first-run credentials: admin/admin (you will be forced to change them).
      tags: [verify]
