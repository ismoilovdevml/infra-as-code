---
# Destructive. Removes the Portainer containers and images. The portainer_data
# volume holds the BoltDB database and the generated certificates; it is kept
# unless portainer_purge_data is true.
- name: Remove Portainer
  hosts: portainer_ce:portainer_ee:portainer_agents
  become: true
  gather_facts: true
  vars_files:
    - vars.yml
  vars:
    portainer_purge_data: false

  tasks:
    - name: Remove the Portainer containers
      community.docker.docker_container:
        name: "{{ item }}"
        state: absent
      loop:
        - "{{ portainer_container_name }}"
        - "{{ portainer_agent_container_name }}"
      tags: [uninstall]

    - name: Remove the Portainer images
      community.docker.docker_image_remove:
        name: "{{ item }}:{{ portainer_tag }}"
        force: true
      loop:
        - "{{ portainer_ce_image }}"
        - "{{ portainer_ee_image }}"
        - "{{ portainer_agent_image }}"
      failed_when: false
      tags: [uninstall]

    - name: Remove the Portainer data volume
      community.docker.docker_volume:
        name: "{{ portainer_volume }}"
        state: absent
      when: portainer_purge_data | bool
      tags: [uninstall]

    - name: Remove the admin password file
      ansible.builtin.file:
        path: "{{ portainer_admin_password_file }}"
        state: absent
      tags: [uninstall]
