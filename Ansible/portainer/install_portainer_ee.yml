---
# Portainer Business Edition (the image is still named portainer-ee).
# A license key is required and is entered in the UI after first login — the
# container itself takes no license argument.
- name: Install Portainer Business Edition
  hosts: portainer_ee
  become: true
  gather_facts: true
  vars_files:
    - vars.yml
  vars:
    portainer_image: "{{ portainer_ee_image }}"

  tasks:
    - name: Deploy the Portainer server
      ansible.builtin.include_tasks: tasks/portainer_server.yml
      tags: [always]

    - name: Remind about the license key
      ansible.builtin.debug:
        msg: "{{ portainer_ee_license_note }}"
      tags: [verify]
