---
- name: Install Portainer CE
  hosts: portainer_ce
  become: true
  gather_facts: true
  vars_files:
    - vars.yml
  vars:
    portainer_image: "{{ portainer_ce_image }}"

  tasks:
    - name: Deploy the Portainer server
      ansible.builtin.include_tasks: tasks/portainer_server.yml
      tags: [always]
