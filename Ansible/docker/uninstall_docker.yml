---
# Destructive. Removes the Docker packages, the repository and, when
# docker_purge_data is true, every container, image, volume and network.
- name: Uninstall Docker Engine
  hosts: all
  become: true
  gather_facts: true
  vars_files:
    - vars.yml
  vars:
    docker_purge_data: false

  tasks:
    - name: Check whether docker is installed
      ansible.builtin.stat:
        path: /usr/bin/docker
      register: docker_binary
      tags: [always]

    - name: Remove all Docker data
      when:
        - docker_binary.stat.exists
        - docker_purge_data | bool
      tags: [uninstall]
      block:
        - name: Prune every container, image, network and volume
          ansible.builtin.command: docker system prune --all --force --volumes
          register: docker_prune
          changed_when: "'Total reclaimed space: 0B' not in docker_prune.stdout"
          failed_when: false

    - name: Stop docker
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        state: stopped
      loop:
        - docker.socket
        - docker.service
      failed_when: false
      when: docker_binary.stat.exists
      tags: [uninstall]

    - name: Remove the Docker packages
      ansible.builtin.package:
        name: "{{ docker_packages + [docker_distro_package_map[ansible_distribution] | default(omit)] | select('string') | list }}"
        state: absent
      failed_when: false
      tags: [uninstall]

    - name: Purge the Docker packages (Debian family)
      ansible.builtin.apt:
        name: "{{ docker_packages }}"
        state: absent
        purge: true
        autoremove: true
      when: ansible_os_family == 'Debian'
      failed_when: false
      tags: [uninstall]

    - name: Remove the Docker repository (Debian family)
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/apt/sources.list.d/docker.sources
        - /etc/apt/sources.list.d/docker.list
        - /etc/apt/keyrings/docker.asc
      when: ansible_os_family == 'Debian'
      tags: [uninstall]

    - name: Remove the Docker repository (RedHat family)
      ansible.builtin.file:
        path: /etc/yum.repos.d/docker-ce.repo
        state: absent
      when: ansible_os_family == 'RedHat'
      tags: [uninstall]

    - name: Remove the Docker repository (SUSE)
      community.general.zypper_repository:
        name: docker-ce-stable
        state: absent
      when: ansible_os_family == 'Suse'
      failed_when: false
      tags: [uninstall]

    - name: Remove the Docker state directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /var/lib/docker
        - /var/lib/containerd
        - /etc/docker
      when: docker_purge_data | bool
      tags: [uninstall]

    - name: Remove the docker group
      ansible.builtin.group:
        name: docker
        state: absent
      tags: [uninstall]
