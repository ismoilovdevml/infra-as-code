---
# LEGACY. Compose v2+ ships as the `docker-compose-plugin` package, which
# install_docker.yml already installs, and is invoked as `docker compose`.
# Upstream marks the standalone `/usr/local/bin/docker-compose` binary as legacy
# and does not recommend it. Use this only for tooling that still shells out to
# the hyphenated command.
- name: Install the legacy standalone Docker Compose binary
  hosts: all
  become: true
  gather_facts: true
  vars_files:
    - vars.yml

  tasks:
    - name: Assert the architecture is published upstream
      ansible.builtin.assert:
        that:
          - ansible_system == 'Linux'
          - ansible_architecture in docker_compose_arch_map
        fail_msg: >-
          No standalone Compose binary is published for {{ ansible_system }}/{{ ansible_architecture }}.
          Published: {{ docker_compose_arch_map.keys() | list | join(', ') }}.
        quiet: true
      tags: [always]

    - name: Download the expected checksum
      ansible.builtin.uri:
        url: >-
          https://github.com/docker/compose/releases/download/{{ docker_compose_standalone_version }}/docker-compose-linux-{{
          docker_compose_arch_map[ansible_architecture] }}.sha256
        return_content: true
      register: docker_compose_checksum
      check_mode: false
      tags: [install]

    - name: Download the Compose binary
      ansible.builtin.get_url:
        url: >-
          https://github.com/docker/compose/releases/download/{{ docker_compose_standalone_version }}/docker-compose-linux-{{
          docker_compose_arch_map[ansible_architecture] }}
        dest: "{{ docker_compose_standalone_path }}"
        checksum: "sha256:{{ docker_compose_checksum.content.split() | first }}"
        owner: root
        group: root
        mode: '0755'
      tags: [install]

    - name: Report the installed version
      ansible.builtin.command: "{{ docker_compose_standalone_path }} version"
      changed_when: false
      check_mode: false
      register: docker_compose_version
      tags: [verify]

    - name: Show the installed version
      ansible.builtin.debug:
        msg: "{{ docker_compose_version.stdout }}"
      tags: [verify]
